<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141418" />
      <stop offset="50%" stop-color="#0f0f12" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <!-- DevSphere Brand Subtle Accent Glow -->
    <radialGradient id="accentGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#e78a53" stop-opacity="0.12" />
      <stop offset="60%" stop-color="#e78a53" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#e78a53" stop-opacity="0" />
    </radialGradient>

    <!-- Avatar Circle Background Gradient -->
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#26262d" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#16161a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Silhouette Shading -->
    <linearGradient id="silhouetteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#71717a" />
      <stop offset="100%" stop-color="#3f3f46" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3f3f46" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#e78a53" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#27272a" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <!-- Base Canvas -->
  <rect width="800" height="800" fill="url(#bgGrad)" />

  <!-- Ambient Glow Layer -->
  <rect width="800" height="800" fill="url(#accentGlow)" />

  <!-- Decorative Subtle Radial Grid Circles -->
  <circle cx="400" cy="400" r="320" fill="none" stroke="#27272a" stroke-width="1" stroke-dasharray="6 6" opacity="0.4" />
  <circle cx="400" cy="400" r="240" fill="none" stroke="#27272a" stroke-width="1" opacity="0.3" />

  <!-- Avatar Halo Frame -->
  <circle cx="400" cy="380" r="160" fill="url(#circleGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Stylized Avatar Silhouette -->
  <!-- Head -->
  <circle cx="400" cy="335" r="58" fill="url(#silhouetteGrad)" />

  <!-- Shoulders / Torso clipped to circle -->
  <g clip-path="url(#avatarClip)">
    <path d="M 280 495 C 280 420 330 405 400 405 C 470 405 520 420 520 495 L 520 540 L 280 540 Z" fill="url(#silhouetteGrad)" />
  </g>

  <clipPath id="avatarClip">
    <circle cx="400" cy="380" r="158" />
  </clipPath>

  <!-- Subtle Inner Border Accent -->
  <circle cx="400" cy="380" r="158" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.05" />
</svg>